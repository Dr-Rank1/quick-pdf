org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=37

# Keep native libraries uncompressed and aligned for 16KB page-size devices.
android.bundle.enableUncompressedNativeLibs=true

# Enable 16KB page-size compatibility (supported by newer toolchains).
android.experimental.enable16kPages=true
